[package]
name = "adhush-tray"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "AdHush tray icon, settings window and notifications"

[dependencies]
serde_json = "1.0.154"
tao = "0.37.2"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.26.1"
# The service API is plain HTTP on loopback: no TLS stack needed.
ureq = { version = "3.5.0", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com"] }
wry = "0.57.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
embed-resource = "3.0.12"
