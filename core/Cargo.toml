[package]
name = "adhush-core"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "AdHush HTTP/HTTPS content filtering proxy (network + cosmetic rules)"
publish = false

[dependencies]
# Default features include "single-thread", which makes Engine !Sync; the proxy shares one engine.
# "css-validation" parses procedural selectors (:has-text, :upward, …) instead of passing them through as CSS.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
anyhow = "1.0.104"
brotli = "9.1.1"
bytes = "1.12.1"
env_logger = "0.11.11"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "http2", "native-tokio", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
log = "0.4.35"
lru = "0.19.0"
psl = "2.1.245"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3.3"
webpki-roots = "1.0.11"

[profile.release]
lto = "thin"
codegen-units = 4

[build-dependencies]
embed-resource = "3.0.12"
